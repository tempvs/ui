name: Build and deploy UI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy to {0}', inputs.target_environment) || 'Deploy to dev' }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      rollback_release:
        description: Optional 40-character commit SHA of an archived UI release to restore
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ui-aws-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_release == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject removed legacy authentication mechanisms
        shell: bash
        run: |
          legacy_token="security""_token"
          legacy_camel_token="security""Token"
          legacy_user_info="User""-Info"
          legacy_user_profile="User""-Profile"
          if git grep -n -I -E "${legacy_token}|${legacy_camel_token}|${legacy_user_info}|${legacy_user_profile}" -- ':!*.md' ':!**/*.md'; then
            echo '::error::Legacy authentication token or user-context header found.'
            exit 1
          fi
      - name: Build and test UI
        run: |
          npm ci
          npm run lint
          npm run test:run
          npm run typecheck
          npm run build
          npm run test:tooling
      - name: Run production browser regression tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # Use the archive mirror over HTTPS: HTTP package requests can stall
          # while installing the fonts needed by Chromium.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' -e 's|http://|https://|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium firefox webkit
          E2E_PREVIEW=true npm run e2e -- --workers=2 --project=chromium --project=mobile-chrome
          # Headed Firefox/WebKit expose Mesa WebGL2. Their native input needs
          # exclusive display focus; concurrent windows can steal hover state.
          # Include enough physical pixels for WebKit's 2x device scale.
          xvfb-run --auto-servernum --server-args='-screen 0 2560x1600x24' env E2E_PREVIEW=true npm run e2e -- --workers=1 --project=firefox --project=webkit
      - name: Preserve failed browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-regressions-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload UI build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-build-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }})
    needs: build
    if: >-
      ${{ always() && (needs.build.result == 'success'
        || (github.event_name == 'workflow_dispatch' && inputs.rollback_release != '')) }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      WEB_BUCKET_NAME: ${{ vars.WEB_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
      ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
    steps:
      - name: Verify deployment configuration
        shell: bash
        run: |
          if [[ "$TARGET_ENVIRONMENT" == 'prod' && "$GITHUB_REF_NAME" != 'master' ]]; then
            echo '::error::Production deployments must be dispatched from master.'
            exit 1
          fi
          if [[ -z "$AWS_ACCOUNT_ID" || ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Set the 12-digit AWS_ACCOUNT_ID in the GitHub $TARGET_ENVIRONMENT environment."
            exit 1
          fi
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" || -z "$WEB_BUCKET_NAME" || -z "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "::error::Set AWS_DEPLOY_ROLE_ARN, WEB_BUCKET_NAME and CLOUDFRONT_DISTRIBUTION_ID in the GitHub $TARGET_ENVIRONMENT environment."
            exit 1
          fi
          if [[ -n "$ROLLBACK_RELEASE" && ! "$ROLLBACK_RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::rollback_release must be a full lowercase 40-character commit SHA.'
            exit 1
          fi
      - name: Download UI build
        if: ${{ inputs.rollback_release == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-build-${{ github.sha }}
          path: build
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Verify deployment identity
        shell: bash
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo '::error::Deployment credentials do not match AWS_ACCOUNT_ID.'
            exit 1
          fi

      - name: Archive release in versioned bucket
        if: ${{ inputs.rollback_release == '' }}
        run: aws s3 sync build/ "s3://$WEB_BUCKET_NAME/releases/$GITHUB_SHA/" --no-progress
      - name: Restore archived release
        if: ${{ inputs.rollback_release != '' }}
        shell: bash
        run: |
          if ! aws s3api head-object --bucket "$WEB_BUCKET_NAME" --key "releases/$ROLLBACK_RELEASE/index.html" >/dev/null; then
            echo '::error::The requested release is not archived in the web bucket.'
            exit 1
          fi
          aws s3 sync "s3://$WEB_BUCKET_NAME/releases/$ROLLBACK_RELEASE/" build/ --no-progress
      - name: Publish static assets, then HTML
        shell: bash
        run: |
          aws s3 sync build/static/ "s3://$WEB_BUCKET_NAME/static/" --cache-control 'public,max-age=31536000,immutable' --no-progress
          if [[ -d build/maps ]]; then
            aws s3 sync build/maps/ "s3://$WEB_BUCKET_NAME/maps/" --cache-control 'public,max-age=0,must-revalidate' --no-progress
          fi
          for asset in build/*; do
            if [[ -f "$asset" && "$asset" != 'build/index.html' ]]; then
              aws s3 cp "$asset" "s3://$WEB_BUCKET_NAME/$(basename "$asset")" --cache-control 'public,max-age=3600' --no-progress
            fi
          done
          aws s3 cp build/index.html "s3://$WEB_BUCKET_NAME/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,no-store,must-revalidate' --no-progress
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'

  verify-dev:
    name: Verify real dev sessions (Chrome, Firefox, WebKit)
    needs: deploy
    if: >-
      ${{ always() && needs.deploy.result == 'success'
        && (github.event_name != 'workflow_dispatch' || inputs.target_environment == 'dev') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify authentication against the deployed dev release
        env:
          E2E_BASE_URL: https://dev.tempvs.club
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --config=playwright.auth.config.ts

  verify-safari:
    name: Verify actual Safari on macOS
    needs: deploy
    if: >-
      ${{ always() && needs.deploy.result == 'success'
        && (github.event_name != 'workflow_dispatch' || inputs.target_environment == 'dev') }}
    runs-on: macos-15
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Apple's Safari WebDriver
        run: sudo safaridriver --enable
      - name: Install isolated Safari test client
        run: |
          python3 -m venv "$RUNNER_TEMP/safari-smoke"
          "$RUNNER_TEMP/safari-smoke/bin/python" -m pip install selenium==4.52.0
      - name: Verify real Safari against dev
        env:
          E2E_ARCHIVED_RELEASE: ${{ inputs.rollback_release }}
          E2E_BASE_URL: https://dev.tempvs.club
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: '"$RUNNER_TEMP/safari-smoke/bin/python" scripts/safari-smoke.py'
